name: Tests
# Runs on every push and pull request: database tests (incl. the two-guests race) and the
# browser end-to-end journey in demo mode. A red cross on a commit means: don't publish it.
on:
  push:
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGPORT: "5432", PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - name: Database tests
        run: bash supabase/test/run.sh

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: End-to-end journey (demo mode)
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tests/e2e/flow.mjs
